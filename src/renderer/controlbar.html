<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:">
<title>Mimoza Sahne kayıt kontrolü</title>
<link rel="stylesheet" href="base.css">
<style>
  body { background: transparent; }
  .bar { margin: 4px; border-radius: 14px; background: rgba(18, 22, 29, .96); border: 1px solid #3a4452; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .row { display: flex; align-items: center; gap: 4px; height: 54px; padding: 0 8px; }
  .grip { -webkit-app-region: drag; color: var(--faint); display: grid; place-items: center; width: 22px; height: 40px; cursor: move; }
  .rec { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 4px; min-width: 104px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px rgba(255,90,95,.2); animation: blink 1.2s infinite; }
  .paused .dot { background: var(--yellow); animation: none; box-shadow: 0 0 0 4px rgba(255,199,44,.2); }
  .waiting .dot { background: var(--faint); animation: none; box-shadow: none; }
  @keyframes blink { 50% { opacity: .35; } }
  .time { font: 600 17px/1 "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }
  .sep { width: 1px; height: 28px; background: var(--line-2); margin: 0 4px; }
  .row button { min-height: 38px; height: 38px; }
  .row button.icon { width: 38px; }
  .meter { width: 6px; height: 30px; border-radius: 3px; background: #2a323d; position: relative; overflow: hidden; }
  .meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--green); transition: height .08s; }
  .tools { display: flex; align-items: center; gap: 4px; height: 50px; padding: 0 10px; border-top: 1px solid var(--line); }
  .swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; padding: 0; min-height: 0; }
  .swatch[aria-pressed="true"] { border-color: #fff; }
  .hint { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
  .hint kbd { padding: 2px 4px; font-size: 10px; }
  label.tmp { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; margin-left: 6px; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="row">
    <span class="grip" title="Taşı" id="grip"></span>
    <div class="rec waiting" id="state"><span class="dot"></span><span class="time" id="time">00:00</span></div>
    <button class="icon" id="pause" title="Duraklat / sürdür (F9)"></button>
    <button class="danger" id="stop" title="Kaydı bitir (F10)"></button>
    <span class="sep"></span>
    <button class="icon" id="draw" title="Çizim modu (Ctrl+Alt+D)" aria-pressed="false"></button>
    <button class="icon" id="clear" title="Tahtayı temizle (Ctrl+Alt+C)"></button>
    <button class="icon" id="mark" title="Bölüm işareti (Ctrl+Alt+M)"></button>
    <button class="icon" id="privacy" title="Gizlilik perdesi (Ctrl+Alt+G)" aria-pressed="false"></button>
    <button class="icon" id="card" title="Kartı göster / gizle (Ctrl+Alt+K)" aria-pressed="false"></button>
    <button class="icon" id="next" title="Sıradaki kart (Ctrl+Alt+N)"></button>
    <span class="sep"></span>
    <button class="icon" id="mic" title="Mikrofonu kapat / aç (Ctrl+Alt+U)" aria-pressed="false"></button>
    <span class="meter" title="Mikrofon seviyesi"><i id="level"></i></span>
    <button class="icon ghost" id="cancel" title="Kaydı iptal et"></button>
  </div>
  <div class="tools" id="tools" hidden>
    <button class="icon" data-tool="pen" title="Kalem (1)" aria-pressed="true"></button>
    <button class="icon" data-tool="highlight" title="Fosforlu kalem (2)" aria-pressed="false"></button>
    <button class="icon" data-tool="arrow" title="Ok (3)" aria-pressed="false"></button>
    <button class="icon" data-tool="box" title="Kutu (4)" aria-pressed="false"></button>
    <button class="icon" data-tool="spot" title="Spot ışığı (5)" aria-pressed="false"></button>
    <button class="icon" data-tool="eraser" title="Silgi (6)" aria-pressed="false"></button>
    <span class="sep"></span>
    <button class="swatch" data-color="#ffc72c" style="background:#ffc72c" aria-pressed="true" title="Sarı"></button>
    <button class="swatch" data-color="#ff5a5f" style="background:#ff5a5f" aria-pressed="false" title="Kırmızı"></button>
    <button class="swatch" data-color="#3ddc97" style="background:#3ddc97" aria-pressed="false" title="Yeşil"></button>
    <button class="swatch" data-color="#59a8ff" style="background:#59a8ff" aria-pressed="false" title="Mavi"></button>
    <button class="swatch" data-color="#ffffff" style="background:#ffffff" aria-pressed="false" title="Beyaz"></button>
    <label class="tmp" title="Açıkken çizimler 3 saniye sonra veya sayfayı kaydırınca silinir (G)"><input type="checkbox" id="temporary" checked> Geçici</label>
    <span class="hint"><kbd>1–6</kbd> araç <kbd>C</kbd> renk <kbd>Esc</kbd> çık</span>
  </div>
</div>
<script src="icons.js"></script>
<script src="../shared/profiles.js"></script>
<script src="controlbar.js"></script>
</body>
</html>
